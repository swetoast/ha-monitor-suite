[project]
name = "ha-monitor-suite"
version = "0.3.4"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8.3,<10",
  "pytest-homeassistant-custom-component>=0.13.205",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
