name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test tools
        run: python -m pip install --upgrade pip pytest pytest-homeassistant-custom-component ruff homeassistant==2025.12.2
      - name: Lint
        run: python -m ruff check custom_components tests
      - name: Format check
        run: python -m ruff format --check custom_components tests
      - name: Test
        run: python -m pytest -q

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: topics description
